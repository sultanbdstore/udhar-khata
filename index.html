<style>:root{--g:#15803d;--r:#dc2626;--navy:#14323f;--teal:#0e7490;--bg:#f4f7f6;--ink:#17262b;--mut:#62767c;--card:#fff;--line:#d5e2e0;--gold:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Noto Sans Bengali","Kalpurush","SolaimanLipi","Nirmala UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer}
#app{max-width:640px;margin:0 auto;padding:0 12px 150px}
.hd{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.hd img{width:42px;height:42px;border-radius:11px;flex:none}
.hd h1{flex:1;margin:0;font-size:1.1rem;color:var(--navy);line-height:1.25;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd h1 small{display:block;font-weight:500;font-size:.72rem;color:var(--g)}
.ib{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 1px 5px #0003;display:grid;place-items:center;font-size:19px;flex:none;text-decoration:none}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.sc{background:#fff;border-radius:16px;padding:12px;box-shadow:0 1px 6px #0002}
.sc small{display:block;color:var(--mut);font-size:.8rem}
.sc b{font-size:1.35rem}
.sc.g b{color:var(--g)}.sc.r b{color:var(--r)}
.net{background:var(--navy);color:#fff;border-radius:16px;padding:12px 14px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}
.net b{font-size:1.25rem}
.tabs{display:flex;gap:6px;margin:10px 0 6px;overflow-x:auto}
.tab{padding:8px 14px;border-radius:99px;background:#fff;box-shadow:0 1px 4px #0002;font-weight:700;font-size:.9rem;white-space:nowrap;color:var(--navy)}
.tab.on{background:var(--teal);color:#fff}
.srch{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;margin:4px 0}
.pi{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px;margin:8px 0;box-shadow:0 1px 5px #0002;text-decoration:none;color:var(--ink)}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.2rem;flex:none}
.pi .m{flex:1;min-width:0}
.pi .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mut{color:var(--mut);font-size:.82rem}
.pi .a{text-align:right}
.pi .a b{font-size:1.05rem;display:block}
.pos{color:var(--g)}.neg{color:var(--r)}.zero{color:var(--mut)}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 6px #0002}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;text-decoration:none;text-align:center}
.btn.g{background:var(--g)}.btn.r{background:var(--r)}.btn.t{background:var(--teal)}.btn.w{background:#fff;color:var(--navy);border:2px solid var(--navy)}.btn.o{background:#ea580c}
.btn.s{padding:7px 11px;font-size:.88rem;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.two>*{flex:1}
.big{font-size:1.9rem;font-weight:800}
.ph{text-align:center;padding:10px 0}
.ph .av{width:70px;height:70px;font-size:1.8rem;margin:0 auto 6px}
.day{font-size:.8rem;color:var(--mut);margin:14px 2px 4px;font-weight:700}
.tx{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin:6px 0;box-shadow:0 1px 4px #0002;cursor:pointer}
.tx .l{flex:1;min-width:0}
.tx .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .ic{font-size:1.3rem}
.tx .am{text-align:right}
.tx .am b{display:block}
.tx.due .mut{color:#b45309}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:84px;z-index:9;background:var(--g);color:#fff;border-radius:99px;padding:14px 20px;font-weight:800;box-shadow:0 4px 14px #0005}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -2px 10px #0003;z-index:8;padding-bottom:env(safe-area-inset-bottom)}
.nav>div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav a{padding:8px 2px 7px;text-align:center;font-size:.76rem;color:var(--mut);text-decoration:none;font-weight:700}
.nav a span{display:block;font-size:1.3rem;line-height:1.2}
.nav a.on{color:var(--teal)}
.banner{border-radius:14px;padding:10px 12px;margin:8px 0;font-size:.9rem}
.banner.y{background:#fff7d6;color:#6b5200}.banner.r{background:#fee2e2;color:#7f1d1d}.banner.g{background:#dcfce7;color:#14532d}
.mod{position:fixed;inset:0;background:#0009;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.mod>div{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 26px}
.mod h2{margin:0 0 8px;font-size:1.1rem;color:var(--navy)}
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-size:.84rem;color:var(--mut);margin-bottom:3px}
input[type=text],input[type=tel],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);background:#fff}
textarea{min-height:110px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.seg button{padding:12px 6px;border-radius:12px;background:#eef3f2;font-weight:800;border:3px solid transparent}
.seg button.on.g{background:#dcfce7;border-color:var(--g);color:#14532d}
.seg button.on.r{background:#fee2e2;border-color:var(--r);color:#7f1d1d}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:99px;z-index:60;max-width:92vw;display:flex;gap:12px;align-items:center;font-size:.92rem}
.toast button{background:none;color:#fbbf24;font-weight:800;padding:0}
.lock{position:fixed;inset:0;background:var(--navy);z-index:80;display:grid;place-items:center;color:#fff;text-align:center}
.lock .pin{display:flex;gap:14px;justify-content:center;margin:14px 0}
.lock .pin i{width:16px;height:16px;border-radius:50%;border:3px solid #fff}.lock .pin i.f{background:#fff}
.kp{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}
.kp button{height:64px;border-radius:50%;background:#ffffff22;color:#fff;font-size:1.5rem;font-weight:700}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.bar2{height:8px;background:#e5eeec;border-radius:5px;overflow:hidden;margin-top:3px}.bar2 i{display:block;height:100%}
h3{margin:16px 2px 6px;font-size:1rem;color:var(--navy)}
.stmt{background:#fff;border-radius:12px;padding:16px;margin:10px 0}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.empty .e{font-size:3rem}
@media (prefers-color-scheme:dark){:root{--bg:#0d1a1e;--ink:#e5f0ee;--mut:#9bb0b0;--navy:#0b2530;--line:#2c4649}.sc,.card,.pi,.tx,.tab,.ib,.srch,.nav,.mod>div,.stmt,input[type=text],input[type=tel],input[type=date],input[type=number],input[type=password],select,textarea{background:#15282d;color:var(--ink)}.tab.on{background:var(--teal);color:#fff}.hd h1,h3,.mod h2{color:#bfe7ee}.btn.w{background:#15282d;color:#bfe7ee;border-color:#4a7a85}.seg button{background:#1d3439;color:var(--ink)}.seg button.on.g{background:#14532d;color:#dcfce7}.seg button.on.r{background:#7f1d1d;color:#fee2e2}.banner.y{background:#3d3410;color:#ffe9a0}.banner.r{background:#4a1d1d;color:#fecaca}.banner.g{background:#12351f;color:#bbf7d0}.nav a{color:#9bb0b0}.nav a.on{color:#67d4e8}.tx.due .mut{color:#fbbf24}.tbl th,.tbl td{border-color:#2c4649}}
@media print{body{background:#fff;color:#000;font-size:12pt}.nav,.fab,.hd .ib,.noprint,.toast{display:none!important}#app{max-width:none;padding:0}.stmt{box-shadow:none;padding:0}.tbl th,.tbl td{border-color:#999}}

.chk{cursor:pointer}.hbtn{border:0;background:#fff;color:#0e7490;font:inherit;font-weight:700;font-size:.85rem;padding:8px 14px;border-radius:99px;box-shadow:0 1px 4px #0002;cursor:pointer;white-space:nowrap}</style></head>
<body><div id="app"></div><noscript>JavaScript চালু করুন।</noscript>
<script>/* ===== আমার খাতা — অফলাইন পাওনা-দেনার হিসাব: ডেটা, হিসাব, ব্যাকআপ ===== */
const APP_VER='2026-11-19-a';
const KEY='udhar.v1';
const $=(s,r=document)=>r.querySelector(s);
const D0='০১২৩৪৫৬৭৮৯';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function blank(){return {v:1,people:[],tx:[],s:{bn:true,hide:false,pin:null,salt:null,lockAfter:60,lastBackup:0,changes:0,tone:'soft',tipSeen:false,created:Date.now()}}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.people)&&Array.isArray(d.tx)){d.s=Object.assign(blank().s,d.s||{});return d}}catch(e){}return blank()}
let DB=load();
let persistAsked=false;
function save(chg){if(chg)DB.s.changes++;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('⚠️ সংরক্ষণ করা যায়নি — ফোনের জায়গা কম বা ব্রাউজার আটকে দিয়েছে। এখনই ব্যাকআপ নিন।')}
 if(!persistAsked){persistAsked=true;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
/* ---------- সংখ্যা ও তারিখ ---------- */
const dg=s=>DB.s.bn?String(s).replace(/\d/g,d=>D0[d]):String(s);
const toAscii=s=>String(s).replace(/[০-৯]/g,d=>D0.indexOf(d));
function grp(n){const s=String(n);if(s.length<=3)return s;return s.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g,',')+','+s.slice(-3)}
function money(p){const a=Math.abs(p),t=Math.floor(a/100),c=a%100;return '৳'+dg(grp(t)+(c?'.'+String(c).padStart(2,'0'):''))}
function plain(p){const a=Math.abs(p),t=Math.floor(a/100),c=a%100;return grp(t)+(c?'.'+String(c).padStart(2,'0'):'')}
let REVEAL=false;
const mk=p=>DB.s.hide&&!REVEAL?'৳ ••••':money(p);
function parseAmt(str){const t=toAscii(str).replace(/[,\s৳]|টাকা/g,'');if(!t)return null;let sum=0;for(const part of t.split('+')){if(!/^\d+(\.\d{1,2})?$/.test(part))return null;sum+=Math.round(parseFloat(part)*100)}return sum>0&&sum<=1e12?sum:null}
const MON=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const WD=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoOf(new Date());
const dOf=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const fd=iso=>{if(!iso)return '';const d=dOf(iso);return dg(d.getDate())+' '+MON[d.getMonth()]+' '+dg(d.getFullYear())};
const fdw=iso=>WD[dOf(iso).getDay()]+', '+fd(iso);
const dayDiff=iso=>Math.round((dOf(iso)-dOf(today()))/86400000);
function dueTxt(iso){const n=dayDiff(iso);return n<0?dg(-n)+' দিন আগে মেয়াদ পার':n==0?'আজ ফেরতের দিন':n==1?'আগামীকাল ফেরতের দিন':dg(n)+' দিন পরে'}
/* ---------- হিসাব ---------- */
const sgn=t=>t.type==='g'?t.amt:-t.amt;     /* g = আমি দিলাম (পাবো বাড়ে), r = আমি পেলাম (পাবো কমে) */
function balMap(){const m={};for(const p of DB.people)m[p.id]=0;for(const t of DB.tx)if(t.pid in m)m[t.pid]+=sgn(t);return m}
function lastMap(){const m={};for(const t of DB.tx){const k=t.date+'|'+(t.ts||0);if(!m[t.pid]||k>m[t.pid])m[t.pid]=k}return m}
const txOf=pid=>DB.tx.filter(t=>t.pid===pid).sort((a,b)=>(a.date+String(a.ts||0).padStart(15,'0')).localeCompare(b.date+String(b.ts||0).padStart(15,'0')));
function withRun(pid){let b=0;return txOf(pid).map(t=>{b+=sgn(t);return {...t,run:b}})}
const personById=id=>DB.people.find(p=>p.id===id);
const PAL=['#0e7490','#7c3aed','#be185d','#b45309','#047857','#1d4ed8','#9a3412','#4d7c0f','#a21caf','#0f766e'];
const colorOf=n=>{let h=0;for(const c of String(n))h=(h*31+c.codePointAt(0))>>>0;return PAL[h%PAL.length]};
const initial=n=>Array.from(String(n).trim())[0]||'?';
function totals(){const m=balMap();let rec=0,pay=0,rc=0,pc=0;for(const k in m){if(m[k]>0){rec+=m[k];rc++}else if(m[k]<0){pay-=m[k];pc++}}return {rec,pay,rc,pc,net:rec-pay}}
function dueList(){const m=balMap(),out=[];for(const p of DB.people){const b=m[p.id];if(!b)continue;const want=b>0?'g':'r';const ds=DB.tx.filter(t=>t.pid===p.id&&t.type===want&&t.due).map(t=>t.due).sort();if(ds.length)out.push({p,due:ds[0],b,n:dayDiff(ds[0])})}return out.sort((a,b)=>a.n-b.n)}
/* ---------- ফোন নম্বর ও বার্তা ---------- */
function intl(ph){let d=toAscii(ph||'').replace(/\D/g,'');if(!d)return '';if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('01'))d='88'+d;else if(d.startsWith('1')&&d.length==10)d='880'+d;return d}
function remindMsg(p,b,tone){const nm=p.name,amt=dg(plain(b))+' টাকা',dt=fd(today());
 if(b>0)return tone=='firm'?`${nm}, আপনার কাছে আমার ${amt} পাওনা আছে (${dt} পর্যন্ত হিসাব)। অনুগ্রহ করে এই সপ্তাহের মধ্যে পরিশোধ করুন। ধন্যবাদ।`:`আসসালামু আলাইকুম ${nm}। আপনার কাছে আমার ${amt} পাওনা আছে (${dt} পর্যন্ত)। সুবিধামতো দিয়ে দিলে উপকৃত হব। ধন্যবাদ।`;
 if(b<0)return `আসসালামু আলাইকুম ${nm}। আমার কাছে আপনার ${amt} পাওনা আছে (${dt} পর্যন্ত হিসাব)। শীঘ্রই পরিশোধ করব, ইনশাআল্লাহ। ধন্যবাদ।`;

const b64=u=>{let s='';u.forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const payload=()=>({app:'udhar-khata',v:1,exported:new Date().toISOString(),people:DB.people,tx:DB.tx});
async function deriveKey(pw,salt,use){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,[use])}
async function encPayload(obj,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await deriveKey(pw,salt,'encrypt');const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return {app:'udhar-khata',enc:1,kdf:'PBKDF2-SHA256-200000',salt:b64(salt),iv:b64(iv),data:b64(new Uint8Array(ct))}}
async function decPayload(o,pw){try{const key=await deriveKey(pw,unb64(o.salt),'decrypt');const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.data));return JSON.parse(new TextDecoder().decode(pt))}catch(e){throw new Error('পাসওয়ার্ড ভুল বা ফাইল নষ্ট')}}
function validate(o){if(!o||o.app!=='udhar-khata'||!Array.isArray(o.people)||!Array.isArray(o.tx))throw new Error('এটি এই অ্যাপের ব্যাকআপ ফাইল নয়');
 const pid=new Set();const people=[],tx=[];
 for(const p of o.people){if(!p||typeof p.id!=='string'||typeof p.name!=='string'||!p.name.trim())continue;pid.add(p.id);people.push({id:p.id,name:p.name.trim().slice(0,80),phone:String(p.phone||'').slice(0,30),note:String(p.note||'').slice(0,200),created:+p.created||Date.now()})}
 for(const t of o.tx){if(!t||typeof t.id!=='string'||!pid.has(t.pid)||(t.type!=='g'&&t.type!=='r'))continue;const amt=Math.round(+t.amt);if(!(amt>0)||!/^\d{4}-\d{2}-\d{2}$/.test(String(t.date)))continue;tx.push({id:t.id,pid:t.pid,type:t.type,amt,date:t.date,due:/^\d{4}-\d{2}-\d{2}$/.test(String(t.due||''))?t.due:'',note:String(t.note||'').slice(0,300),ts:+t.ts||0})}
 return {people,tx,skipped:(o.people.length-people.length)+(o.tx.length-tx.length)}}
function csvCell(s){s=String(s==null?'':s);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}

 [...DB.tx].sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0)).forEach(t=>{const p=personById(t.pid);rows.push([t.date,p.name,p.phone,t.type=='g'?'দিলাম':'পেলাম',(t.amt/100).toFixed(2),t.due,t.note,(map[t.id]/100).toFixed(2)])});
 return '﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
async function sha(pin,salt){if(crypto.subtle){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return b64(new Uint8Array(h))}let h=2166136261;for(const c of salt+pin){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return 'f'+(h>>>0)}

 const upd=()=>o.querySelectorAll('#pd i').forEach((e,i)=>e.classList.toggle('f',i<v.length));

function about(){modal(`<h2>ℹ️ আমার খাতা — তথ্য ও সীমাবদ্ধতা</h2><p>বন্ধু-পরিচিতের সাথে ধার/পাওনা-দেনার হিসাব। <b>বিজ্ঞাপন নেই, লগইন নেই, সার্ভার নেই, বিনামূল্যে।</b> ইন্টারনেট ছাড়াই চলে।</p>
